<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ここ行きたい</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f6f6;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 22px 16px 50px;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #777;
      font-size: 15px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }

    .label {
      font-weight: 700;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #999;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #111;
      color: #fff;
    }

    .secondary {
      background: #eeeeee;
      color: #222;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    .platform {
      font-weight: 700;
    }

    #map {
      width: 100%;
      height: 360px;
      border-radius: 14px;
      background: #eee;
    }

    .small {
      font-size: 13px;
      color: #888;
      margin-top: 9px;
    }

    .saved-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .saved-item:last-child {
      border-bottom: none;
    }

    .saved-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .saved-url {
      color: #777;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .remove {
      padding: 8px 10px;
      font-size: 13px;
      margin-top: 8px;
      background: #eee;
    }

    .empty {
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>ここ行きたい</h1>

    <p class="subtitle">
      SNSで見つけた場所を、忘れない。
    </p>


    <div class="card">

      <div class="label">
        投稿URL
      </div>

      <input
        id="postUrl"
        type="url"
        placeholder="Instagram / TikTok のURLを貼り付け"
      >

      <button
        class="primary"
        onclick="analyzeUrl()"
      >
        場所を探す
      </button>

      <div id="status"></div>

    </div>


    <div class="card">

      <div class="label">
        MAP
      </div>

      <div id="map"></div>

      <div class="small">
        現在はGoogle Maps表示の動作確認段階です。
      </div>

    </div>


    <div class="card">

      <div class="label">
        保存した投稿
      </div>

      <div id="savedList"></div>

    </div>

  </div>


<script>

let map;


/* ==============================
   Google Maps
============================== */

function initMap() {

  const hiroshima = {
    lat: 34.3853,
    lng: 132.4553
  };

  map = new google.maps.Map(
    document.getElementById("map"),
    {
      center: hiroshima,
      zoom: 12,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false
    }
  );

}


/* ==============================
   URL解析
============================== */

function analyzeUrl() {

  const input =
    document.getElementById("postUrl");

  const url =
    input.value.trim();

  const status =
    document.getElementById("status");


  if (!url) {

    status.innerHTML =
      "投稿URLを貼り付けてください。";

    return;
  }


  let platform = "";


  if (
    url.includes("instagram.com")
  ) {

    platform = "Instagram";

  }

  else if (
    url.includes("tiktok.com")
  ) {

    platform = "TikTok";

  }

  else {

    status.innerHTML =
      "Instagram または TikTok のURLを貼り付けてください。";

    return;

  }


  status.innerHTML = `
    <span class="platform">
      ${platform}
    </span>
    の投稿を確認しました。<br>
    投稿URLを保存しました。
  `;


  savePost(
    url,
    platform
  );

}


/* ==============================
   投稿保存
============================== */

function savePost(
  url,
  platform
) {

  const saved =
    JSON.parse(
      localStorage.getItem(
        "kokoIkitaiPosts"
      ) || "[]"
    );


  const exists =
    saved.some(
      item => item.url === url
    );


  if (!exists) {

    saved.push({

      id: Date.now(),

      url: url,

      platform: platform,

      createdAt:
        new Date().toISOString()

    });


    localStorage.setItem(
      "kokoIkitaiPosts",
      JSON.stringify(saved)
    );

  }


  displaySavedPosts();

}


/* ==============================
   保存一覧
============================== */

function displaySavedPosts() {

  const area =
    document.getElementById(
      "savedList"
    );


  const saved =
    JSON.parse(
      localStorage.getItem(
        "kokoIkitaiPosts"
      ) || "[]"
    );


  if (!saved.length) {

    area.innerHTML =
      '<div class="empty">まだ保存されていません。</div>';

    return;

  }


  area.innerHTML = "";


  saved
    .slice()
    .reverse()
    .forEach(item => {

      const div =
        document.createElement("div");

      div.className =
        "saved-item";


      div.innerHTML = `

        <div class="saved-title">
          ${escapeHtml(item.platform)}
        </div>

        <div class="saved-url">
          ${escapeHtml(item.url)}
        </div>

        <button
          class="secondary"
          onclick="openPost('${encodeURIComponent(item.url)}')"
        >
          元の投稿を見る
        </button>

        <button
          class="remove"
          onclick="removePost(${item.id})"
        >
          削除
        </button>

      `;


      area.appendChild(div);

    });

}


/* ==============================
   投稿を開く
============================== */

function openPost(
  encodedUrl
) {

  const url =
    decodeURIComponent(
      encodedUrl
    );

  window.open(
    url,
    "_blank"
  );

}


/* ==============================
   削除
============================== */

function removePost(
  id
) {

  let saved =
    JSON.parse(
      localStorage.getItem(
        "kokoIkitaiPosts"
      ) || "[]"
    );


  saved =
    saved.filter(
      item => item.id !== id
    );


  localStorage.setItem(
    "kokoIkitaiPosts",
    JSON.stringify(saved)
  );


  displaySavedPosts();

}


/* ==============================
   HTML安全化
============================== */

function escapeHtml(
  value
) {

  const div =
    document.createElement("div");

  div.textContent =
    value;

  return div.innerHTML;

}


displaySavedPosts();

</script>

</script>


</body>
</html>
