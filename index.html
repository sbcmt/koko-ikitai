<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ここ行きたい</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #faf8fb;
  color: #29252d;
}

.container {
  max-width: 650px;
  margin: 0 auto;
  padding: 22px 16px 60px;
}

.header {
  padding: 16px 4px 22px;
}

h1 {
  margin: 0;
  font-size: 31px;
  letter-spacing: -1px;
}

.subtitle {
  margin: 6px 0 0;
  color: #89818c;
  font-size: 14px;
}

.card {
  background: rgba(255,255,255,.96);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 8px 30px rgba(80,60,90,.07);
}

.label {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 16px;
  border: 1px solid #ebe5ed;
  border-radius: 15px;
  background: #faf8fb;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #b9a7c0;
  background: white;
}

button {
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 15px;
  margin-top: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #2d2830;
  color: white;
}

.soft {
  background: #f1ebf3;
  color: #463b4c;
}

.nav {
  background: #efe7f3;
  color: #392f3e;
}

.source {
  background: #f7f5f8;
  color: #665d69;
}

#status {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.6;
  color: #756c78;
}

#map {
  height: 360px;
  border-radius: 18px;
  overflow: hidden;
}

#resultCard {
  display: none;
}

.place-name {
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 6px;
}

.place-address {
  color: #817886;
  font-size: 14px;
  line-height: 1.5;
}

.badge {
  display: inline-block;
  background: #f2ebf5;
  color: #625269;
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 20px;
  margin-bottom: 10px;
}

.saved-item {
  padding: 14px 0;
  border-bottom: 1px solid #eee9ef;
}

.saved-item:last-child {
  border-bottom: none;
}

.saved-name {
  font-weight: 700;
}

.saved-address {
  color: #89818c;
  font-size: 13px;
  margin-top: 4px;
}

.empty {
  color: #aaa2ad;
  font-size: 14px;
}

.small-button {
  width: auto;
  padding: 8px 12px;
  font-size: 13px;
  margin-right: 5px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>ここ行きたい</h1>
    <p class="subtitle">SNSで見つけた場所を、忘れない。</p>
  </div>

  <div class="card">

    <div class="label">
      Instagram / TikTok の投稿URL
    </div>

    <input
      id="postUrl"
      type="url"
      placeholder="URLをここに貼り付け"
    >

    <button
      class="primary"
      onclick="analyzePost()"
    >
      場所を探す
    </button>

    <div id="status"></div>

  </div>


  <div
    class="card"
    id="resultCard"
  >

    <div
      class="badge"
      id="platformBadge"
    ></div>

    <div
      class="place-name"
      id="placeName"
    ></div>

    <div
      class="place-address"
      id="placeAddress"
    ></div>

    <button
      class="primary"
      onclick="saveCurrentPlace()"
    >
      ♡ ここ行きたいに保存
    </button>

    <button
      class="nav"
      onclick="startNavigation()"
    >
      Google Mapsでナビを始める
    </button>

    <button
      class="source"
      onclick="openOriginalPost()"
    >
      元の投稿を見る
    </button>

  </div>


  <div class="card">

    <div class="label">
      MAP
    </div>

    <div id="map"></div>

  </div>


  <div class="card">

    <div class="label">
      保存した場所
    </div>

    <div id="savedList"></div>

  </div>

</div>


<script>

let map;
let marker = null;

let currentPlace = null;
let currentPostUrl = "";
let currentPlatform = "";


/* =================================
   Google Maps
================================= */

function initMap() {

  map = new google.maps.Map(
    document.getElementById("map"),
    {
      center: {
        lat: 34.3853,
        lng: 132.4553
      },

      zoom: 12,

      mapTypeControl: false,

      streetViewControl: false,

      fullscreenControl: false
    }
  );

}


/* =================================
   投稿解析
================================= */

async function analyzePost() {

  const url =
    document
      .getElementById("postUrl")
      .value
      .trim();

  if (!url) {

    setStatus(
      "投稿URLを貼り付けてください。"
    );

    return;
  }


  let platform = "";


  if (
    url.includes("instagram.com")
  ) {

    platform = "Instagram";

  }

  else if (
    url.includes("tiktok.com")
  ) {

    platform = "TikTok";

  }

  else {

    setStatus(
      "InstagramまたはTikTokのURLを貼り付けてください。"
    );

    return;
  }


  currentPostUrl = url;
  currentPlatform = platform;


  setStatus(
    platform +
    " の投稿を解析しています…"
  );


  try {

    const postText =
      await getPostText(
        platform,
        url
      );


    if (!postText) {

      setStatus(
        "投稿の文章を取得できませんでした。"
      );

      return;
    }


    console.log(
      "取得した投稿文",
      postText
    );


    const address =
      extractAddress(
        postText
      );


    if (!address) {

      setStatus(
        "投稿は取得できましたが、住所を見つけられませんでした。"
      );

      return;
    }


    setStatus(
      "住所候補を見つけました。<br>" +
      escapeHtml(address) +
      "<br>Google Mapsで確認しています…"
    );


    await searchGooglePlace(
      address
    );


  }

  catch (error) {

    console.error(error);

    setStatus(
      "投稿情報を取得できませんでした。"
    );

  }

}


/* =================================
   SNS投稿情報取得
================================= */

async function getPostText(
  platform,
  url
) {

  if (
    platform === "TikTok"
  ) {

    const endpoint =
      "https://www.tiktok.com/oembed?url=" +
      encodeURIComponent(url);


    const response =
      await fetch(endpoint);


    if (!response.ok) {

      throw new Error(
        "TikTok取得失敗"
      );

    }


    const data =
      await response.json();


    return (
      data.title || ""
    );

  }


  if (
    platform === "Instagram"
  ) {

    const endpoint =
      "https://graph.facebook.com/v26.0/instagram_oembed" +
      "?url=" +
      encodeURIComponent(url) +
      "&omitscript=true" +
      "&hidecaption=false";


    const response =
      await fetch(endpoint);


    if (!response.ok) {

      throw new Error(
        "Instagram取得失敗"
      );

    }


    const data =
      await response.json();


    if (!data.html) {

      return "";

    }


    const html =
      data.html
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/<\/p>/gi, "\n")
        .replace(/<\/div>/gi, "\n");


    const temp =
      document.createElement("div");


    temp.innerHTML =
      html;


    return (
      temp.innerText ||
      temp.textContent ||
      ""
    );

  }


  return "";

}


/* =================================
   住所抽出
================================= */

function extractAddress(text) {

  const clean =
    text
      .replace(/\r/g, "\n")
      .replace(/\n+/g, "\n");


  const lines =
    clean
      .split("\n")
      .map(
        line =>
          line.trim()
      )
      .filter(Boolean);


  const prefectureRegex =
    /(北海道|東京都|京都府|大阪府|青森県|岩手県|宮城県|秋田県|山形県|福島県|茨城県|栃木県|群馬県|埼玉県|千葉県|神奈川県|新潟県|富山県|石川県|福井県|山梨県|長野県|岐阜県|静岡県|愛知県|三重県|滋賀県|兵庫県|奈良県|和歌山県|鳥取県|島根県|岡山県|広島県|山口県|徳島県|香川県|愛媛県|高知県|福岡県|佐賀県|長崎県|熊本県|大分県|宮崎県|鹿児島県|沖縄県)/;


  /* 📍・住所・所在地を優先 */

  for (
    const line of lines
  ) {

    if (
      (
        line.includes("📍") ||
        line.includes("住所") ||
        line.includes("所在地")
      )
      &&
      prefectureRegex.test(line)
    ) {

      return cleanAddress(
        line
      );

    }

  }


  /* 都道府県を含む行 */

  for (
    const line of lines
  ) {

    if (
      prefectureRegex.test(line)
    ) {

      return cleanAddress(
        line
      );

    }

  }


  /* 全文から探す */

  const match =
    clean.match(
      new RegExp(
        prefectureRegex.source +
        "[^\\n#]{4,80}"
      )
    );


  if (match) {

    return cleanAddress(
      match[0]
    );

  }


  return "";

}


function cleanAddress(
  value
) {

  return value

    .replace(
      /^.*?(📍|住所[:：]?|所在地[:：]?)/,
      ""
    )

    .replace(
      /(?:営業時間|定休日|TEL|電話|アクセス).*$/i,
      ""
    )

    .replace(
      /[#♡♥︎❤].*$/,
      ""
    )

    .trim();

}


/* =================================
   Google Places検索
================================= */

async function searchGooglePlace(
  query
) {

  const { Place } =
    await google.maps.importLibrary(
      "places"
    );


  const request = {

    textQuery: query,

    fields: [
      "displayName",
      "formattedAddress",
      "location",
      "id"
    ],

    language: "ja",

    region: "jp",

    maxResultCount: 5
  };


  const { places } =
    await Place.searchByText(
      request
    );


  if (
    !places ||
    !places.length
  ) {

    setStatus(
      "Google Mapsで場所を特定できませんでした。"
    );

    return;
  }


  const place =
    places[0];


  if (
    !place.location
  ) {

    setStatus(
      "場所の位置情報を取得できませんでした。"
    );

    return;
  }


  const lat =
    place.location.lat();

  const lng =
    place.location.lng();


  currentPlace = {

    placeId:
      place.id,

    name:
      place.displayName ||
      "名称未取得",

    address:
      place.formattedAddress ||
      query,

    lat,

    lng
  };


  showPlace();

}


/* =================================
   場所表示
================================= */

function showPlace() {

  if (!currentPlace) {

    return;

  }


  const position = {

    lat:
      currentPlace.lat,

    lng:
      currentPlace.lng
  };


  map.setCenter(
    position
  );


  map.setZoom(
    17
  );


  if (
    marker
  ) {

    marker.setMap(
      null
    );

  }


  marker =
    new google.maps.Marker({

      position,

      map,

      title:
        currentPlace.name

    });


  document
    .getElementById(
      "placeName"
    )
    .textContent =
      currentPlace.name;


  document
    .getElementById(
      "placeAddress"
    )
    .textContent =
      currentPlace.address;


  document
    .getElementById(
      "platformBadge"
    )
    .textContent =
      currentPlatform;


  document
    .getElementById(
      "resultCard"
    )
    .style.display =
      "block";


  setStatus(
    "場所を見つけました。"
  );

}


/* =================================
   Google Mapsナビ
================================= */

function startNavigation() {

  if (!currentPlace) {

    return;

  }


  const destination =
    currentPlace.lat +
    "," +
    currentPlace.lng;


  let url =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(
      destination
    );


  if (
    currentPlace.placeId
  ) {

    url +=
      "&destination_place_id=" +
      encodeURIComponent(
        currentPlace.placeId
      );

  }


  window.open(
    url,
    "_blank"
  );

}


/* =================================
   保存
================================= */

function saveCurrentPlace() {

  if (!currentPlace) {

    return;

  }


  const saved =
    JSON.parse(
      localStorage.getItem(
        "kokoIkitaiPlaces"
      ) || "[]"
    );


  const exists =
    saved.some(
      item =>
        item.placeId ===
        currentPlace.placeId
    );


  if (!exists) {

    saved.push({

      id:
        Date.now(),

      placeId:
        currentPlace.placeId,

      name:
        currentPlace.name,

      address:
        currentPlace.address,

      lat:
        currentPlace.lat,

      lng:
        currentPlace.lng,

      sourceUrl:
        currentPostUrl,

      platform:
        currentPlatform,

      category:
        "",

      listId:
        "",

      memo:
        "",

      savedAt:
        new Date()
          .toISOString()

    });


    localStorage.setItem(
      "kokoIkitaiPlaces",
      JSON.stringify(saved)
    );

  }


  displaySavedPlaces();


  setStatus(
    "「ここ行きたい」に保存しました ♡"
  );

}


/* =================================
   保存一覧
================================= */

function displaySavedPlaces() {

  const area =
    document.getElementById(
      "savedList"
    );


  const saved =
    JSON.parse(
      localStorage.getItem(
        "kokoIkitaiPlaces"
      ) || "[]"
    );


  if (!saved.length) {

    area.innerHTML =
      '<div class="empty">まだ保存した場所はありません。</div>';

    return;

  }


  area.innerHTML = "";


  saved
    .slice()
    .reverse()
    .forEach(
      place => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "saved-item";


        div.innerHTML = `

          <div class="saved-name">
            ${escapeHtml(place.name)}
          </div>

          <div class="saved-address">
            ${escapeHtml(place.address)}
          </div>

          <button
            class="soft small-button"
            onclick="navigateSaved(${place.lat},${place.lng},'${escapeJs(place.placeId)}')"
          >
            ナビ
          </button>

          <button
            class="source small-button"
            onclick="window.open('${escapeJs(place.sourceUrl)}','_blank')"
          >
            投稿を見る
          </button>

        `;


        area.appendChild(
          div
        );

      }
    );

}


/* =================================
   保存済みナビ
================================= */

function navigateSaved(
  lat,
  lng,
  placeId
) {

  let url =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(
      lat + "," + lng
    );


  if (placeId) {

    url +=
      "&destination_place_id=" +
      encodeURIComponent(
        placeId
      );

  }


  window.open(
    url,
    "_blank"
  );

}


/* =================================
   元投稿
================================= */

function openOriginalPost() {

  if (
    currentPostUrl
  ) {

    window.open(
      currentPostUrl,
      "_blank"
    );

  }

}


/* =================================
   Utility
================================= */

function setStatus(
  text
) {

  document
    .getElementById(
      "status"
    )
    .innerHTML =
      text;

}


function escapeHtml(
  value
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value;

  return div.innerHTML;

}


function escapeJs(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


displaySavedPlaces();

</script>

</body>
</html>
